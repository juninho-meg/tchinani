<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product 1 - Tchinani Store</title>

    <!-- Nafs l-fichier CSS ta l-site -->
    <link rel="stylesheet" href="css.css">
</head>

<body>

    <!-- Topbar Transparent -->
    <header class="topbar">
        <div class="left-icons">
            <button class="icon-btn">
                🛒 <span>Cart</span>
            </button>
            <button class="icon-btn">
                🔍
            </button>
        </div>

        <div class="logo">
            TCHINANI
        </div>

        <button class="menu-btn">
            ☰
        </button>
    </header>

    <!-- Main Content ta Product & Checkout -->
    <main class="product-page-main">

        <!-- 1. Galerie ta l-Produit (Taswira Kbira + Taswirat Sghar) -->
        <div class="product-gallery">
            <div class="product-large-card">
                <img id="mainImage" src="photo0.pnj.png" alt="Product Main">
            </div>
            
            <div class="thumbnail-list">
                <img src="photo0.pnj.png" alt="Thumb 1" class="thumb active" onclick="changeImage(this)">
                <img src="photo1.pnj.png" alt="Thumb 2" class="thumb" onclick="changeImage(this)">
                <img src="photo0.pnj.png" alt="Thumb 3" class="thumb" onclick="changeImage(this)">
                <img src="photo1.pnj.png" alt="Thumb 4" class="thumb" onclick="changeImage(this)">
            </div>
        </div>

        <!-- Ma&euml;lomat ta l-Produit -->
        <div class="product-info-box">
            <h2>Product 1</h2>
            <p class="product-price">5000 DA</p>
            <p class="product-desc">Discover premium products for your lifestyle. High quality guaranteed for Tchinani Store customers.</p>
        </div>

        <!-- 2. Formulaire ta Les Coordonnées m3a Ga3 Les Wilayas -->
        <section class="checkout-section">
            <h3>Commander ce produit</h3>
            <form class="checkout-form">
                
                <div class="form-group">
                    <label for="fullname">Nom et Prénom (الإسم و اللقب)</label>
                    <input type="text" id="fullname" placeholder="Ex: Mohamed Tchinani" required>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro de Téléphone (رقم الهاتف)</label>
                    <input type="tel" id="phone" placeholder="Ex: 06xxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="wilaya">Wilaya (الولاية)</label>
                    <select id="wilaya" onchange="handleWilayaChange()" required>
                        <option value="">Sélectionnez votre wilaya</option>
                        <option value="Adrar">01 - Adrar</option>
                        <option value="Chlef">02 - Chlef</option>
                        <option value="Laghouat">03 - Laghouat</option>
                        <option value="Oum El Bouaghi">04 - Oum El Bouaghi</option>
                        <option value="Batna">05 - Batna</option>
                        <option value="Béjaïa">06 - Béjaïa</option>
                        <option value="Biskra">07 - Biskra</option>
                        <option value="Béchar">08 - Béchar</option>
                        <option value="Blida">09 - Blida</option>
                        <option value="Bouira">10 - Bouira</option>
                        <option value="Tamanrasset">11 - Tamanrasset</option>
                        <option value="Tébessa">12 - Tébessa</option>
                        <option value="Tlemcen">13 - Tlemcen</option>
                        <option value="Tiaret">14 - Tiaret</option>
                        <option value="Tizi Ouzou">15 - Tizi Ouzou</option>
                        <option value="Algiers">16 - Alger</option>
                        <option value="Djelfa">17 - Djelfa</option>
                        <option value="Jijel">18 - Jijel</option>
                        <option value="Sétif">19 - Sétif</option>
                        <option value="Saïda">20 - Saïda</option>
                        <option value="Skikda">21 - Skikda</option>
                        <option value="Sidi Bel Abbès">22 - Sidi Bel Abbès</option>
                        <option value="Annaba">23 - Annaba</option>
                        <option value="Guelma">24 - Guelma</option>
                        <option value="Constantine">25 - Constantine</option>
                        <option value="Médéa">26 - Médéa</option>
                        <option value="Mostaganem">27 - Mostaganem</option>
                        <option value="M'Sila">28 - M'Sila</option>
                        <option value="Mascara">29 - Mascara</option>
                        <option value="Ouargla">30 - Ouargla</option>
                        <option value="Oran">31 - Oran</option>
                        <option value="El Bayadh">32 - El Bayadh</option>
                        <option value="Illizi">33 - Illizi</option>
                        <option value="Bordj Bou Arréridj">34 - Bordj Bou Arréridj</option>
                        <option value="Boumerdès">35 - Boumerdès</option>
                        <option value="El Tarf">36 - El Tarf</option>
                        <option value="Tindouf">37 - Tindouf</option>
                        <option value="Tissemsilt">38 - Tissemsilt</option>
                        <option value="El Oued">39 - El Oued</option>
                        <option value="Khenchela">40 - Khenchela</option>
                        <option value="Souk Ahras">41 - Souk Ahras</option>
                        <option value="Tipaza">42 - Tipaza</option>
                        <option value="Mila">43 - Mila</option>
                        <option value="Aïn Defla">44 - Aïn Defla</option>
                        <option value="Naâma">45 - Naâma</option>
                        <option value="Aïn Témouchent">46 - Aïn Témouchent</option>
                        <option value="Ghardaïa">47 - Ghardaïa</option>
                        <option value="Relizane">48 - Relizane</option>
                        <option value="Timimoun">49 - Timimoun</option>
                        <option value="Bordj Badji Mokhtar">50 - Bordj Badji Mokhtar</option>
                        <option value="Ouled Djellal">51 - Ouled Djellal</option>
                        <option value="Béni Abbès">52 - Béni Abbès</option>
                        <option value="In Salah">53 - In Salah</option>
                        <option value="In Guezzam">54 - In Guezzam</option>
                        <option value="Touggourt">55 - Touggourt</option>
                        <option value="Djanet">56 - Djanet</option>
                        <option value="El M'Ghair">57 - El M'Ghair</option>
                        <option value="El Meniaa">58 - El Meniaa</option>
                    </select>
                </div>

                <!-- Box Prix de Livraison & Options -->
                <div class="delivery-box">
                    <div class="delivery-header">
                        <span>🚚 Prix de livraison (سعر التوصيل)</span>
                        <span id="delivery-badge" class="badge-wait">اختر الولاية</span>
                    </div>

                    <div id="delivery-options" class="delivery-options" style="display: none;">
                        <label class="delivery-choice">
                            <input type="radio" name="deliveryType" value="maison" checked onchange="updateTotal()">
                            <div class="choice-info">
                                <span class="choice-title">🏠 À domicile (للمنزل)</span>
                                <span id="price-maison" class="choice-price">0 DA</span>
                            </div>
                        </label>

                        <label class="delivery-choice">
                            <input type="radio" name="deliveryType" value="bureau" onchange="updateTotal()">
                            <div class="choice-info">
                                <span class="choice-title">🏢 Stop Desk (للمكتب)</span>
                                <span id="price-bureau" class="choice-price">0 DA</span>
                            </div>
                        </label>
                    </div>

                    <div class="total-summary">
                        <span>Total à payer (المجموع):</span>
                        <span id="final-total" class="total-price">5000 DA</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Adresse (العنوان - الحي)</label>
                    <input type="text" id="address" placeholder="Ex: Es Senia, Oran" required>
                </div>

                <button type="submit" class="submit-order-btn">Confirmer la commande</button>
            </form>
        </section>

    </main>

    <!-- JavaScript ta Galerie w Livraison -->
    <script>
        const productPrice = 5000;

        const deliveryRates = {
            "Oran": { maison: 400, bureau: 250 },
            "Algiers": { maison: 500, bureau: 300 },
            "Blida": { maison: 500, bureau: 300 },
            "Constantine": { maison: 600, bureau: 350 },
            "Sétif": { maison: 600, bureau: 350 },
            "Tlemcen": { maison: 500, bureau: 300 },
            "Adrar": { maison: 1100, bureau: 700 },
            "Tamanrasset": { maison: 1400, bureau: 900 },
            "default": { maison: 700, bureau: 400 }
        };

        let currentMaison = 0;
        let currentBureau = 0;

        function changeImage(element) {
            const mainImage = document.getElementById('mainImage');
            mainImage.src = element.src;

            const thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach(thumb => thumb.classList.remove('active'));
            element.classList.add('active');
        }

        function handleWilayaChange() {
            const wilaya = document.getElementById("wilaya").value;
            const optionsDiv = document.getElementById("delivery-options");
            const badge = document.getElementById("delivery-badge");

            if (wilaya === "") {
                optionsDiv.style.display = "none";
                badge.textContent = "اختر الولاية";
                badge.className = "badge-wait";
                currentMaison = 0;
                currentBureau = 0;
            } else {
                const rates = deliveryRates[wilaya] || deliveryRates["default"];
                currentMaison = rates.maison;
                currentBureau = rates.bureau;

                document.getElementById("price-maison").textContent = currentMaison + " DA";
                document.getElementById("price-bureau").textContent = currentBureau + " DA";

                optionsDiv.style.display = "grid";
                badge.className = "badge-active";
            }
            updateTotal();
        }

        function updateTotal() {
            const wilaya = document.getElementById("wilaya").value;
            const badge = document.getElementById("delivery-badge");
            const finalTotalEl = document.getElementById("final-total");

            if (wilaya === "") {
                finalTotalEl.textContent = productPrice + " DA";
                return;
            }

            const selectedType = document.querySelector('input[name="deliveryType"]:checked').value;
            const shippingCost = (selectedType === "maison") ? currentMaison : currentBureau;

            badge.textContent = shippingCost + " DA";
            finalTotalEl.textContent = (productPrice + shippingCost) + " DA";
        }
    </script>

</body>
</html>
