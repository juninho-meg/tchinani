<body>

    <!-- Main Content ta Product & Checkout -->
    <main class="product-page-main">

        <!-- 1. Galerie ta l-Produit -->

                <!-- Bureau / Adresse Select (Stop Desk) -->

                <!-- Box Prix de Livraison & Options -->

                                <input type="radio" name="productColor" value="Bleu">

                            <label class="color-choice">
                                <input type="radio" name="productColor" value="Blanc">

                    <!-- Quantity Selector Box -->
                    <div class="quantity-box">
                        <label class="quantity-label">Quantité (الكمية)</label>
                        <div class="qntt-controls">
                            <button type="button" class="qntt-btn" onclick="qnttDown()">−</button>
                            <span id="quantity-value" class="qntt-value">1</span>
                            <input type="hidden" id="quantity-input" name="productQuantity" value="1">
                            <button type="button" class="qntt-btn" onclick="qnttUp()">+</button>
                        </div>
                    </div>

                    <div class="total-summary">
                        <span>Total à payer (المجموع):</span>
                        <span id="final-total" class="total-price">5000 DA</span>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="submit-order-btn">Confirmer la commande</button>
            </form>
        </section>

    </main>

    <!-- JavaScript Production Ready -->
    <script>
        // ==========================================
        // CONFIGURATION DE L'API (LOCAL vs INTERNET)
        // ==========================================
        // Ki t-hébergi server.js f Render wela Railway, baddel had l-lien b l-lien ta3ek:
        const PRODUCTION_API_URL = "https://tchinani-backend.onrender.com/api/orders";
        
        // Détection automatique: Localhost (PC) wela Internet (Production)
        const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:")
            ? "http://localhost:3000/api/orders"
            : PRODUCTION_API_URL;

        const productPrice = 5000;

        // Tracking Source (Facebook / Instagram / Direct)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const utmSource = urlParams.get('utm_source');
            if (utmSource) {
                localStorage.setItem('traffic_source', utmSource);
            }
        });

        const deliveryRates = {
            "Oran": { maison: 400, bureau: 250 },
            "Algiers": { maison: 500, bureau: 300 },
            "Blida": { maison: 500, bureau: 300 },
            "Constantine": { maison: 600, bureau: 350 },
            "Sétif": { maison: 600, bureau: 350 },
            "Tlemcen": { maison: 500, bureau: 300 },
            "Adrar": { maison: 1100, bureau: 700 },
            "Tamanrasset": { maison: 1400, bureau: 900 },
            "default": { maison: 700, bureau: 400 }
        };

        let currentMaison = 0;
        let currentBureau = 0;

        // 1. Galerie d'images
        function changeImage(element) {
            const mainImage = document.getElementById('mainImage');
            mainImage.src = element.src;

            const thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach(thumb => thumb.classList.remove('active'));
            element.classList.add('active');
        }

        // 2. Quantité (+ w -)
        function qnttUp() {
            let quantityValue = parseInt(document.getElementById('quantity-value').textContent);
            if (quantityValue < 20) {
                quantityValue++;
                document.getElementById('quantity-value').textContent = quantityValue;
                document.getElementById('quantity-input').value = quantityValue;
                updateTotal();
            }
        }

        function qnttDown() {
            let quantityValue = parseInt(document.getElementById('quantity-value').textContent);
            if (quantityValue > 1) {
                quantityValue--;
                document.getElementById('quantity-value').textContent = quantityValue;
                document.getElementById('quantity-input').value = quantityValue;
                updateTotal();
            }
        }

        // 3. Wilaya Change w Gestion des Bureaux
        function handleWilayaChange() {
            const wilayaSelect = document.getElementById("wilaya");
            const bureauGroup = document.getElementById("bureau-group");
            const bureauSelect = document.getElementById("bureau");
            const selectedWilaya = wilayaSelect.value;
            const optionsDiv = document.getElementById("delivery-options");
            const badge = document.getElementById("delivery-badge");

            bureauSelect.innerHTML = '<option value="">Sélectionnez le bureau</option>';

            if (selectedWilaya === "") {
                optionsDiv.style.display = "none";
                bureauGroup.style.display = "none";
                badge.textContent = "اختر الولاية";
                badge.className = "badge-wait";
                currentMaison = 0;
                currentBureau = 0;
            } else {
                if (wilayaBureaux[selectedWilaya]) {
                    bureauGroup.style.display = "block";
                    wilayaBureaux[selectedWilaya].forEach(bureau => {
                        const option = document.createElement("option");
                        option.value = bureau;
                        option.textContent = bureau;
                        bureauSelect.appendChild(option);
                    });
                } else {
                    bureauGroup.style.display = "none";
                }

                const rates = deliveryRates[selectedWilaya] || deliveryRates["default"];
                currentMaison = rates.maison;
                currentBureau = rates.bureau;

                document.getElementById("price-maison").textContent = currentMaison + " DA";
                document.getElementById("price-bureau").textContent = currentBureau + " DA";

                optionsDiv.style.display = "grid";
                badge.className = "badge-active";
            }
            updateTotal();
        }

        // 4. Hisab Total Final
        function updateTotal() {
            const wilaya = document.getElementById("wilaya").value;
            const badge = document.getElementById("delivery-badge");
            const finalTotalEl = document.getElementById("final-total");
            
            const quantity = parseInt(document.getElementById("quantity-input").value) || 1;
            const productsSubtotal = productPrice * quantity;

            if (wilaya === "") {
                finalTotalEl.textContent = productsSubtotal + " DA";
                return;
            }

            const selectedType = document.querySelector('input[name="deliveryType"]:checked').value;
            const shippingCost = (selectedType === "maison") ? currentMaison : currentBureau;

            badge.textContent = shippingCost + " DA";
            finalTotalEl.textContent = (productsSubtotal + shippingCost) + " DA";
        }

        // Base de données des 58 wilayas
        const wilayaBureaux = {
            "Adrar": ["Bureau Adrar Centre", "Timimoun Stop Desk"],
            "Chlef": ["Bureau Chlef Centre", "Boukadir Bureau", "Tenes Bureau"],
            "Laghouat": ["Bureau Laghouat Centre", "Aflou Bureau"],
            "Oum El Bouaghi": ["Bureau Oum El Bouaghi Centre", "Ain Beida Bureau", "Ain M'lila Bureau"],
            "Batna": ["Bureau Batna Centre", "Barika Bureau", "Ain Touta Bureau"],
            "Béjaïa": ["Bureau Béjaïa Centre", "Akbou Bureau", "Amizour Bureau"],
            "Biskra": ["Bureau Biskra Centre", "Sidi Okba Bureau"],
            "Béchar": ["Bureau Béchar Centre"],
            "Blida": ["Bureau Blida Centre", "Boufarik Bureau", "El Affroun Bureau"],
            "Bouira": ["Bureau Bouira Centre", "Lakhdaria Bureau", "Sour El Ghozlane Bureau"],
            "Tamanrasset": ["Bureau Tamanrasset Centre"],
            "Tébessa": ["Bureau Tébessa Centre", "Cheria Bureau"],
            "Tlemcen": ["Bureau Tlemcen Centre", "Maghnia Bureau", "Ghazaouet Bureau"],
            "Tiaret": ["Bureau Tiaret Centre", "Frenda Bureau", "Ksar Chellala Bureau"],
            "Tizi Ouzou": ["Bureau Tizi Ouzou Centre", "Azeffoun Bureau", "Draa Ben Khedda Bureau"],
            "Algiers": ["Bureau Bab Ezzouar", "Bureau Cheraga", "Bureau Hydra", "Bureau Kouba", "Bureau Alger Centre", "Bureau Dar El Beida"],
            "Djelfa": ["Bureau Djelfa Centre", "Messaad Bureau", "Hassi Bahbah Bureau"],
            "Jijel": ["Bureau Jijel Centre", "El Taher Bureau"],
            "Sétif": ["Bureau Sétif Centre", "El Eulma Bureau", "Ain Arnat Bureau"],
            "Saïda": ["Bureau Saïda Centre"],
            "Skikda": ["Bureau Skikda Centre", "Azzaba Bureau", "Collo Bureau"],
            "Sidi Bel Abbès": ["Bureau Sidi Bel Abbès Centre", "Sfisef Bureau"],
            "Annaba": ["Bureau Annaba Centre", "Seraidi Bureau", "El Bouni Bureau"],
            "Guelma": ["Bureau Guelma Centre", "Oued Zenati Bureau"],
            "Constantine": ["Bureau Ville Nouvelle Ali Mendjeli", "Bureau Constantine Centre", "Bureau Daksi", "El Khroub"],
            "Médéa": ["Bureau Médéa Centre", "Ksar El Boukhari", "Berrouaghia"],
            "Mostaganem": ["Bureau Mostaganem Centre", "Achaacha Bureau"],
            "M'Sila": ["Bureau M'Sila Centre", "Boussaada Bureau", "Magra Bureau"],
            "Mascara": ["Bureau Mascara Centre", "Sig Bureau", "Ghriss Bureau"],
            "Ouargla": ["Bureau Ouargla Centre", "Hassi Messaoud Bureau"],
            "Oran": ["Bureau Oran Centre (Bd de la Soummam)", "Bureau Es Senia", "Bureau Bir El Djir (USTO)", "Bureau Hai El Makkari"],
            "El Bayadh": ["Bureau El Bayadh Centre"],
            "Illizi": ["Bureau Illizi Centre"],
            "Bordj Bou Arréridj": ["Bureau Bordj Bou Arréridj Centre", "Ras El Oued Bureau"],
            "Boumerdès": ["Bureau Boumerdès Centre", "Bordj Menaiel", "Dellys"],
            "El Tarf": ["Bureau El Tarf Centre", "El Kala Bureau", "Drean Bureau"],
            "Tindouf": ["Bureau Tindouf Centre"],
            "Tissemsilt": ["Bureau Tissemsilt Centre", "Theniet El Had"],
            "El Oued": ["Bureau El Oued Centre", "Guemar Bureau"],
            "Khenchela": ["Bureau Khenchela Centre", "Kais Bureau"],
            "Souk Ahras": ["Bureau Souk Ahras Centre", "Sedrata Bureau"],
            "Tipaza": ["Bureau Tipaza Centre", "Koléa Bureau", "Cherchell Bureau", "Hadjout Bureau"],
            "Mila": ["Bureau Mila Centre", "Chelghoum Laid Bureau", "Tadjenanet Bureau"],
            "Aïn Defla": ["Bureau Aïn Defla Centre", "Khemis Miliana", "El Abadia"],
            "Naâma": ["Bureau Naâma Centre", "Mecheria Bureau"],
            "Aïn Témouchent": ["Bureau Aïn Témouchent Centre", "Beni Saf Bureau"],
            "Ghardaïa": ["Bureau Ghardaïa Centre", "Metlili Bureau", "Berriane Bureau"],
            "Relizane": ["Bureau Relizane Centre", "Oued Rhiou Bureau", "Mazouna Bureau"],
            "Timimoun": ["Bureau Timimoun Centre"],
            "Bordj Badji Mokhtar": ["Bureau Bordj Badji Mokhtar Centre"],
            "Ouled Djellal": ["Bureau Ouled Djellal Centre"],
            "Béni Abbès": ["Bureau Béni Abbès Centre"],
            "In Salah": ["Bureau In Salah Centre"],
            "In Guezzam": ["Bureau In Guezzam Centre"],
            "Touggourt": ["Bureau Touggourt Centre"],
            "Djanet": ["Bureau Djanet Centre"],
            "El M'Ghair": ["Bureau El M'Ghair Centre"],
            "El Meniaa": ["Bureau El Meniaa Centre"]
        };

        // 5. Envoi de la commande au Backend
        async function submitOrder(event) {
            event.preventDefault();

            const submitBtn = document.getElementById("submit-btn");
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = "Envoi en cours... ⏳";

            const order = {
                product: "Product 1",
                fullname: document.getElementById("fullname").value,
                phone: document.getElementById("phone").value,
                wilaya: document.getElementById("wilaya").value,
                bureau: document.getElementById("bureau").value || "Non spécifié",
                address: document.getElementById("address").value,
                color: document.querySelector('input[name="productColor"]:checked').value,
                deliveryType: document.querySelector('input[name="deliveryType"]:checked').value,
                quantity: parseInt(document.getElementById("quantity-input").value),
                totalPrice: document.getElementById("final-total").textContent,
                source: localStorage.getItem('traffic_source') || 'Direct',
                date: new Date().toLocaleString("fr-DZ")
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(order)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Déclencher événement Meta Pixel si activé
                    if (typeof fbq === 'function') {
                        fbq('track', 'Purchase', {
                            value: parseInt(order.totalPrice),
                            currency: 'DZD'
                        });
                    }

                    alert("✅ Merci ! Votre commande a été confirmée.\nNuméro de suivi : " + result.orderId);
                    window.location.reload();
                } else {
                    alert("❌ Erreur : " + (result.message || "Impossible d'enregistrer la commande."));
                }
            } catch (err) {
                console.error("Erreur API:", err);
                alert("⚠️ Erreur de connexion avec le serveur. Veuillez réessayer.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        }
    </script>

</body>
